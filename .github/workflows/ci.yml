name: CI

on:
  pull_request:
    branches: [main]

# env:
#   DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ startsWith(github.ref, 'refs/pull/') }}

permissions:
  contents: read

defaults:
  run:
    working-directory: ios

jobs:
  formatter:
    name: Formatter
    runs-on: macos-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - name: Run formatter check
        run: swiftformat --lint .
  lint:
    name: Lint
    runs-on: macos-26
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - name: GitHub Action for SwiftLint
        run: |
          brew install swiftlint
          swiftlint --strict --config .swiftlint.yml
  tests:
    name: Tests
    needs: ["build"]
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - name: "Restore Xcode build data"
        uses: actions/cache/restore@v6
        with:
          key: 
            xcode-deriveddata-${{ runner.os }}-${{ github.workflow }}-${{ github.sha }}
          restore-keys:
            xcode-deriveddata-${{ runner.os }}-${{ github.workflow }}-
          path:
            ios/DerivedData
      
      # - name: Cache Xcode build data
      #   uses: irgaly/xcode-cache@v1
      #   with:
      #     key: xcode-deriveddata-${{ runner.os }}-${{ github.workflow }}-${{ github.sha }}
      #     restore-keys: |
      #       xcode-deriveddata-${{ runner.os }}-${{ github.workflow }}-
      #     deriveddata-directory: ios/DerivedData
      #     swiftpm-package-resolved-file: |
      #       ios/**/Package.resolved
      #     swiftpm-cache-key: xcode-sourcepackages-${{ runner.os }}-${{ hashFiles('ios/**/Package.resolved') }}
      
      - name: Run tests
        run: "xcodebuild test-without-building -skipMacroValidation -workspace FreeroomsApple.xcworkspace -scheme Tests -destination 'platform=iOS Simulator,name=iPhone 17 Pro' -derivedDataPath DerivedData -parallel-testing-enabled YES -parallel-testing-worker-count 3"
  build:
    name: Build
    runs-on: macos-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Restore Xcode build data
        uses: actions/cache/restore@v6
        with:
          restore-keys:
            xcode-deriveddata-${{ runner.os }}-${{ github.workflow }}-
          path:
            ios/DerivedData

      # - name: Cache Xcode build data
      #   uses: irgaly/xcode-cache@v1
      #   with:
      #     key: xcode-deriveddata-${{ runner.os }}-${{ github.workflow }}-${{ github.sha }}
      #     restore-keys: |
      #       xcode-deriveddata-${{ runner.os }}-${{ github.workflow }}-
      #     deriveddata-directory: ios/DerivedData
      #     swiftpm-package-resolved-file: |
      #       ios/**/Package.resolved
      #     swiftpm-cache-key: xcode-sourcepackages-${{ runner.os }}-${{ hashFiles('ios/**/Package.resolved') }}

      - name: Build for testing
        run: "xcodebuild build-for-testing -skipMacroValidation -workspace FreeroomsApple.xcworkspace -scheme Tests -destination 'generic/platform=iOS Simulator' -derivedDataPath DerivedData"

      - name: Cache Xcode build data
        uses: actions/cache/save@v6
        with:
          key: 
            docc-deriveddata-${{ runner.os }}-${{ github.workflow }}-${{ github.sha }}
          path:
            ios/DerivedData
