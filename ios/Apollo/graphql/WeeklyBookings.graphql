query WeeklyBookings($weekStart: timestamptz!, $weekEnd: timestamptz!) {
  bookings(
    where: {
      _and: [{ start: { _lt: $weekEnd } }, { end: { _gt: $weekStart } }]
    }
    order_by: [{ start: asc }]
  ) {
    name
    eventId
    occurrenceId
    bookingType
    roomId
    start
    end
    room {
      name
      abbr
      usage
      capacity
      building {
        id
        name
      }
    }
  }
}
