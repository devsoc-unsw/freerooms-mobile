query BuildingRooms($buildingId: String! = "K-G27") {
  rooms(where: { buildingId: { _eq: $buildingId } }) {
    abbr
    accessibility
    audiovisual
    capacity
    floor
    id
    infotechnology
    lat
    long
    microphone
    name
    school
    seating
    service
    usage
    writingMedia
    buildingId
  }
}
